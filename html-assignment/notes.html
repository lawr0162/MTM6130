<!-- Description list with 5 tags-->
<dl>
    <dt>&lt;html&gt;</dt>
    <dd>The root element of an HTML page.</dd>
    <dt>&lt;head&gt;</dt>
    <dd>Contains meta information about the document.</dd>
    <dt>&lt;title&gt;</dt>
    <dd>Specifies the title of the document.</dd>
    <dt>&lt;body&gt;</dt>
    <dd>Contains the visible content of the document.</dd>
    <dt>&lt;header&gt;</dt>
    <dd>Represents the header of a section or the entire page.</dd>
